name: CI

on:
  push:
    branches: ["claude/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: فحص صياغة المصدر
        run: python -m compileall app scripts tests

      - name: بناء الفهرس من data/
        run: python scripts/build_index.py

      - name: الاختبارات السريعة
        run: pytest -q
